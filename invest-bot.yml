name: Investment Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # на всеки 5 минути (UTC, GitHub може леко да закъснява)
  workflow_dispatch:         # позволява ръчно пускане от GitHub UI (Actions таб)

concurrency:
  group: invest-bot
  cancel-in-progress: false   # опашка вместо застъпване, ако два run-а съвпаднат

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run investment bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.ID_CHAT }}
        run: python invest_bot_runner.py

      - name: Commit updated state / history
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          if [ -f portfolio_history.csv ]; then git add portfolio_history.csv; fi

          git diff --staged --quiet
          if [ $? -eq 0 ]; then
            echo "Няма промени за commit."
            exit 0
          fi

          git commit -m "bot: state update $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            git push
            if [ $? -eq 0 ]; then
              echo "Push успешен (опит $i)."
              exit 0
            fi
            echo "Push отхвърлен (опит $i) — fetch + merge (favor нашата версия на state файла)..."
            git fetch origin main
            git merge origin/main --no-edit -X ours
            sleep $(( (RANDOM % 5) + 1 ))
          done

          echo "Push не успя след 5 опита."
          exit 1
