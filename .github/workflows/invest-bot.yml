name: Investment Tracker v6

# Цени → docs/invest/*.csv (в git, нищо не се губи) + Telegram алерти/отчети.
# Командите в Telegram се обработват от Cloudflare Worker (webhook), не тук.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # на ~15 мин (GitHub може да закъснее; скриптът е устойчив)
  workflow_dispatch:                # ръчно: Actions → Investment Tracker v6 → Run workflow

concurrency:
  group: invest-bot
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.ID_CHAT }}
        run: |
          set -o pipefail
          python scripts/invest_tracker.py 2>&1 | tee /tmp/run.log
          {
            echo "## 📈 Invest Tracker"
            echo '```'
            cat /tmp/run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
