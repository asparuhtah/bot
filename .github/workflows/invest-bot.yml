name: Investment Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # на всеки 5 минути (UTC, GitHub може леко да закъснява)
  workflow_dispatch:         # позволява ръчно пускане от GitHub UI (Actions таб)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run investment bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
        run: python invest_bot_runner.py

      - name: Commit updated state / history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json portfolio_history.csv
          git diff --staged --quiet || git commit -m "bot: state update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
