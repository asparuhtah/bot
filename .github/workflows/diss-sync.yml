name: Dissertation Sync

on:
  push:
    paths:
      - 'dissertation/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build diss-data.json
        run: python scripts/diss_build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/diss-data.json
          git diff --staged --quiet || git commit -m "diss sync $(date -u +%Y-%m-%d)"
          git push
